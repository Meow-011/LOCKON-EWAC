    <title>LOCKON EWAC</title>
    <!--
      No webfont request. The four families are carried in the build and declared
      in `src/fonts.css`, so the interface looks the same in a vehicle as it does
      on a desk, and the shipped `csp` names no font host at all.

      This replaces a non-blocking <link> to Google Fonts and the media="print"
      flip that applied it, which existed because a render-blocking stylesheet
      made a launch with no network look like a hang. With the files local there
      is nothing to wait for and nothing to flip.
    -->
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
